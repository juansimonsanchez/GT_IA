services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-backend
    restart: unless-stopped
    volumes:
      - /srv/ai-models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    environment:
      # Ayuda a evitar la fragmentación de memoria reportada en el log
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_TOKEN= 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
    command: [
      "Qwen/Qwen2.5-VL-7B-Instruct-AWQ",
      "--port", "8000",
      "--quantization", "awq",
      "--kv-cache-memory", "5946600448", 
      "--gpu-memory-utilization", "0.85",
      "--max-model-len", "8192",
      "--trust-remote-code",
      "--limit-mm-per-prompt", "{\"image\":2,\"video\":0,\"audio\":0}",
      "--enable-auto-tool-choice",          # Reintroducido para Open WebUI
      "--tool-call-parser", "hermes",       # Reintroducido para Open WebUI
      "--enable-prefix-caching",  
      "--uvicorn-log-level", "warning"
    ]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - ai-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui_storage:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=none
      - WEBUI_AUTH=True
      - ENABLE_SIGNUP=True
      - SHOW_GENERATION_DETAILS=True
    depends_on:
      - vllm
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  openwebui_storage:
